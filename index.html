<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garfield Lanches - Cardápio Digital</title>
    <meta name="theme-color" content="#16706F">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="shortcut icon" href="assets/img/logo.webp" type="image/x-icon">
</head>
<body>

    <header class="board">
        <img src="assets/img/logo.webp" alt="" class="board-logo" width="96" height="96">
        <div class="board-text">
            <h1 class="board-name">Garfield Lanches</h1>
            <p class="board-sub">Lanches na chapa. Entrega, retirada ou mesa.</p>
            <div class="board-phones">
                <a href="tel:+5519995219372">(19) 99521-9372</a>
                <a href="tel:+5519996158563">(19) 99615-8563</a>
            </div>
        </div>
    </header>

    <nav class="categories" aria-label="Categorias do cardápio">
        <button class="cat-btn active" onclick="filterMenu('todos')">Todos</button>
        <button class="cat-btn" onclick="filterMenu('hotdogs')">Hot dogs</button>
        <button class="cat-btn" onclick="filterMenu('lanches')">Lanches</button>
        <button class="cat-btn" onclick="filterMenu('gigantes')">Gigantes</button>
        <button class="cat-btn" onclick="filterMenu('bebidas')">Bebidas</button>
    </nav>

    <main class="menu-container" id="menu-container">
        <div id="loading-state" class="loading">
            <p class="loading-title">Esquentando a chapa…</p>
            <p>Carregando o cardápio.</p>
        </div>
    </main>

    <footer class="cart-footer" onclick="openCheckoutModal()" role="button" tabindex="0" aria-label="Ver pedido">
        <div class="cart-info">
            <p><span id="cart-count">0</span> itens</p>
            <small>R$ <span id="cart-total">0,00</span></small>
        </div>
        <button class="btn-order">Ver pedido</button>
    </footer>

    <div id="addon-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeAddonModal()" role="button" aria-label="Fechar">&times;</span>
            <h2 id="modal-burger-name">Lanche</h2>

            <div id="addon-section">
                <p class="modal-subtitle">Quer algum acréscimo?</p>
                <div class="addon-list" id="addon-list-container"></div>
            </div>

            <div id="flavor-section" style="display: none;">
                <p class="modal-subtitle">Escolha o sabor</p>
                <div id="flavor-list" class="addon-list"></div>
            </div>

            <div class="observation-section">
                <label for="item-observation">Alguma observação?</label>
                <textarea id="item-observation" placeholder="Ex.: sem cebola, sem maionese" rows="2"></textarea>
            </div>

            <button class="btn-confirm" onclick="confirmItemWithAddons()">
                Adicionar por R$ <span id="modal-total-price">0,00</span>
            </button>
        </div>
    </div>

    <div id="checkout-modal" class="modal">
        <div class="modal-content checkout-content">
            <span class="close-modal" onclick="closeCheckoutModal()" role="button" aria-label="Fechar">&times;</span>
            <h2>Seu pedido</h2>

            <div id="checkout-items" class="checkout-items-list"></div>
            <hr class="checkout-divider">
            <h3 class="checkout-total-text">Subtotal <span>R$ <span id="checkout-subtotal">0,00</span></span></h3>
            <h3 class="checkout-total-text checkout-final">Total <span>R$ <span id="checkout-final-total">0,00</span></span></h3>

            <div class="checkout-form">
                <label for="orderType">Como você quer receber?</label>
                <select id="orderType" onchange="toggleOrderType()" class="highlight-select">
                    <option value="entrega">Entrega (delivery)</option>
                    <option value="mesa">Estou no local (mesa)</option>
                </select>

                <div id="delivery-fields">
                    <label for="cep">CEP para calcular a entrega</label>
                    <div class="cep-row">
                        <input type="text" id="cep" placeholder="Ex.: 13484-489" maxlength="9" inputmode="numeric" onblur="calculateDelivery()">
                        <button type="button" class="btn-add" onclick="calculateDelivery()">Calcular</button>
                    </div>
                    <div id="frete-info" class="frete-info"></div>

                    <div id="address-details-group" style="display: none;">
                        <label for="address">Endereço de entrega</label>
                        <input type="text" id="address" placeholder="Rua, bairro, cidade" readonly class="readonly-input">

                        <div class="address-row">
                            <div class="address-number">
                                <label for="addressNumber">Número</label>
                                <input type="text" id="addressNumber" placeholder="Ex.: 123">
                            </div>
                            <div class="address-complement">
                                <label for="addressComplement">Complemento</label>
                                <input type="text" id="addressComplement" placeholder="Opcional">
                            </div>
                        </div>
                    </div>
                </div>

                <div id="dine-in-fields" class="dine-in" style="display: none;">
                    <label for="tableNumber">Número da mesa</label>
                    <input type="text" id="tableNumber" placeholder="Ex.: Mesa 04">
                </div>

                <div id="payment-section">
                    <label for="payment">Forma de pagamento</label>
                    <select id="payment" onchange="toggleTroco()">
                        <option value="Pix">Pix</option>
                        <option value="Cartão">Cartão (débito ou crédito)</option>
                        <option value="Dinheiro">Dinheiro</option>
                    </select>

                    <div id="troco-container" class="troco-container">
                        <label for="troco">Troco para quanto?</label>
                        <input type="text" id="troco" placeholder="Ex.: R$ 50,00" inputmode="decimal">
                    </div>
                </div>
            </div>

            <button class="btn-confirm btn-whatsapp" onclick="sendToWhatsApp()">Enviar pedido pelo WhatsApp</button>
        </div>
    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
