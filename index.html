<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Garfield Lanches - Cardápio Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="shortcut icon" href="assets/img/logo.webp" type="image/x-icon">
</head>
<body>

    <header class="menu-header">
        <div class="logo">
            GARFIELD <span class="highlight">LANCHES</span>
        </div>
        <p class="tagline">Disk Entrega: (19) 99521-9372 / (19) 99615-8563</p>
    </header>

    <nav class="categories">
        <button class="cat-btn active" onclick="filterMenu('todos')">Todos</button>
        <button class="cat-btn" onclick="filterMenu('hotdogs')">Hot Dogs</button>
        <button class="cat-btn" onclick="filterMenu('lanches')">Lanches</button>
        <button class="cat-btn" onclick="filterMenu('gigantes')">Gigantes</button>
        <button class="cat-btn" onclick="filterMenu('bebidas')">Bebidas</button>
    </nav>

    <main class="menu-container" id="menu-container">
        <div id="loading-state" style="grid-column: 1 / -1; text-align: center; padding: 50px 20px; color: var(--primary-color);">
            <h2 style="font-size: 1.5rem; margin-bottom: 10px;">🍔 A carregar o cardápio...</h2>
            <p style="color: var(--text-muted);">A procurar os lanches fresquinhos direto da chapa!</p>
        </div>
    </main>

    <footer class="cart-footer" onclick="openCheckoutModal()">
        <div class="cart-info">
            <p><span id="cart-count">0</span> itens</p>
            <small>R$ <span id="cart-total">0,00</span></small>
        </div>
        <button class="btn-order">Ver Pedido</button>
    </footer>

    <div id="addon-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeAddonModal()">&times;</span>
            <h2 id="modal-burger-name">Lanche</h2>
            
            <div id="addon-section">
                <p class="modal-subtitle">Deseja algum acréscimo?</p>
                <div class="addon-list" id="addon-list-container"></div>
            </div>

            <div id="flavor-section" style="display: none; margin-bottom: 15px;">
                <p class="modal-subtitle" style="margin-bottom: 10px; color: var(--text-main); font-weight: 600;">Escolha o sabor:</p>
                <div id="flavor-list" class="addon-list"></div>
            </div>

            <div class="observation-section">
                <label for="item-observation">Alguma observação?</label>
                <textarea id="item-observation" placeholder="Ex: Tirar cebola, sem maionese..." rows="2"></textarea>
            </div>

            <button class="btn-confirm" onclick="confirmItemWithAddons()">
                Adicionar - R$ <span id="modal-total-price">0,00</span>
            </button>
        </div>
    </div>

    <div id="checkout-modal" class="modal">
        <div class="modal-content checkout-content">
            <span class="close-modal" onclick="closeCheckoutModal()">&times;</span>
            <h2>O Seu Pedido</h2>
            
            <div id="checkout-items" class="checkout-items-list"></div>
            <hr class="checkout-divider">
            <h3 class="checkout-total-text">Subtotal: <span>R$ <span id="checkout-subtotal">0,00</span></span></h3>
            <h3 class="checkout-total-text" style="color: var(--primary-color);">Total Final: <span>R$ <span id="checkout-final-total">0,00</span></span></h3>

            <div class="checkout-form">
                <label>Tipo de Pedido:</label>
                <select id="orderType" onchange="toggleOrderType()" class="highlight-select">
                    <option value="entrega">🛵 Entrega (Delivery)</option>
                    <option value="mesa">🍽️ No Estabelecimento (Mesa)</option>
                </select>

                <div id="delivery-fields">
                    <label>1. Calcular Frete (Insira o seu CEP):</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="cep" placeholder="Ex: 13484-489" maxlength="9" onblur="calculateDelivery()" style="flex: 1;">
                        <button type="button" class="btn-add" onclick="calculateDelivery()" style="padding: 0 15px; border-radius: 10px;">Buscar</button>
                    </div>
                    <div id="frete-info" style="color: var(--primary-color); font-weight: bold; margin-top: 8px; font-size: 0.9rem;"></div>

                    <div id="address-details-group" style="display: none; animation: fadeIn 0.4s ease;">
                        <label>2. Morada de Entrega:</label>
                        <input type="text" id="address" placeholder="Rua, Bairro, Cidade" readonly class="readonly-input">

                        <div style="display: flex; gap: 10px;">
                            <div style="flex: 1;">
                                <label>Número:</label>
                                <input type="text" id="addressNumber" placeholder="Ex: 123">
                            </div>
                            <div style="flex: 2;">
                                <label>Complemento:</label>
                                <input type="text" id="addressComplement" placeholder="Opcional">
                            </div>
                        </div>
                    </div>
                </div>

                <div id="dine-in-fields" style="display: none; background: rgba(255, 140, 0, 0.05); padding: 15px; border-radius: 10px; border: 1px dashed var(--primary-color); margin-top: 15px;">
                    <label style="margin-top: 0; color: var(--primary-color);">Qual é o número da sua mesa?</label>
                    <input type="text" id="tableNumber" placeholder="Ex: Mesa 04">
                </div>

                <label>Forma de Pagamento:</label>
                <select id="payment" onchange="toggleTroco()">
                    <option value="Pix">Pix</option>
                    <option value="Cartão">Cartão (Débito/Crédito)</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>

                <div id="troco-container" class="troco-container">
                    <label>Troco para quanto?</label>
                    <input type="text" id="troco" placeholder="Ex: R$ 50,00">
                </div>
            </div>

            <button class="btn-confirm btn-whatsapp" onclick="sendToWhatsApp()" style="margin-top: 25px;">Enviar Pedido (WhatsApp)</button>
        </div>
    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
